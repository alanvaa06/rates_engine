name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,config]"
      # Rendered from the package's own docstrings, which
      # tests/test_docstrings.py holds to 100% coverage with units on every
      # numeric parameter. The reference is therefore a view of the contract
      # rather than a second place to keep it right.
      - name: Render
        run: pdoc --output-directory site rates_engine
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
